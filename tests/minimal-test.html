<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Минимальный тест</title>
    <style>
        .chart-wrapper { height: 300px; width: 600px; margin: 20px; }
        .toggle-btn { padding: 5px 10px; margin: 5px; }
        .toggle-btn.active { background: blue; color: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>
    <h1>Минимальный тест диаграмм</h1>
    
    <div>
        <h3 id="departmentsBarChartTitle">Количество отклонений</h3>
        <button class="toggle-btn active" data-mode="count" data-target="departments">шт</button>
        <button class="toggle-btn" data-mode="percent" data-target="departments">%</button>
        <div class="chart-wrapper">
            <canvas id="departmentsBarChart"></canvas>
        </div>
    </div>

    <script>
        console.log('Chart.js загружен:', typeof Chart !== 'undefined');
        
        // Простая функция создания диаграммы
        function createSimpleChart(canvasId, data, mode) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) {
                console.error('Canvas не найден:', canvasId);
                return;
            }
            
            // Уничтожаем предыдущий график
            if (window[canvasId + 'Instance']) {
                window[canvasId + 'Instance'].destroy();
            }
            
            const isCount = mode === 'count';
            const chartData = isCount ? data.deviations : data.percentages;
            
            window[canvasId + 'Instance'] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.departments,
                    datasets: [{
                        data: chartData,
                        backgroundColor: '#FFA726'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
            
            console.log('Диаграмма создана:', canvasId, mode);
        }
        
        // Тестовые данные
        const testData = {
            departments: ['Группа 1', 'Группа 2', 'Группа 3'],
            deviations: [100, 80, 60],
            percentages: [10.5, 8.2, 6.1]
        };
        
        // Создаем диаграмму
        setTimeout(() => {
            createSimpleChart('departmentsBarChart', testData, 'count');
            
            // Добавляем обработчики переключателя
            document.querySelectorAll('.toggle-btn[data-target="departments"]').forEach(btn => {
                btn.addEventListener('click', function() {
                    const mode = this.dataset.mode;
                    
                    // Обновляем активную кнопку
                    document.querySelectorAll('.toggle-btn[data-target="departments"]').forEach(b => {
                        b.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    // Обновляем заголовок
                    const title = mode === 'count' ? 'Количество отклонений' : 'Процент отклонений';
                    document.getElementById('departmentsBarChartTitle').textContent = title;
                    
                    // Перерисовываем диаграмму
                    createSimpleChart('departmentsBarChart', testData, mode);
                });
            });
        }, 100);
    </script>
</body>
</html>
