<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест вкладки Динамика</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-button" data-tab="company">Компания</button>
            <button class="tab-button" data-tab="departments">Подразделения</button>
            <button class="tab-button" data-tab="employees">Команда</button>
            <button class="tab-button active" data-tab="dynamics">Динамика</button>
        </div>

        <!-- Dynamics Tab Content -->
        <div id="dynamicsTab" class="tab-content active">
            <!-- Закрепленная панель фильтров -->
            <div class="sticky-header">
                <!-- Фильтры для динамики -->
                <div class="filters-container">
                <div class="filter-group">
                    <div class="filter-item">
                        <span class="filter-label">Период с:</span>
                        <input type="date" id="dynStartDate" value="2025-07-01" class="date-input">
                    </div>
                    <div class="filter-item">
                        <span class="filter-label">по:</span>
                        <input type="date" id="dynEndDate" value="2025-07-31" class="date-input">
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-item">
                        <span class="filter-label">Режим отображения:</span>
                        <select id="dynTimeGranularity">
                            <option value="День">День</option>
                            <option value="Неделя">Неделя</option>
                            <option value="Месяц" selected>Месяц</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <span class="filter-label">КЦ:</span>
                        <select id="dynCallCenter">
                            <option value="Все КЦ">Все КЦ</option>
                            <option value="КЦ 1">КЦ 1</option>
                            <option value="КЦ 2">КЦ 2</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <span class="filter-label">Группы:</span>
                        <div class="multi-select-container">
                            <button type="button" class="multi-select-button" id="dynDepartmentsButton">
                                <span id="dynDepartmentsText">Все группы</span>
                                <span class="multi-select-arrow">▼</span>
                            </button>
                            <div class="multi-select-dropdown" id="dynDepartmentsDropdown" style="display: none;">
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_dept_all" value="all" checked>
                                    <label for="dyn_dept_all">Все группы</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_dept_gridchina" value="Гридчина">
                                    <label for="dyn_dept_gridchina">Гридчина - группа</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_dept_korovina" value="Коровина">
                                    <label for="dyn_dept_korovina">Коровина - группа</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="filter-item">
                        <span class="filter-label">Сотрудники:</span>
                        <div class="multi-select-container">
                            <button type="button" class="multi-select-button" id="dynEmployeesButton">
                                <span id="dynEmployeesText">Все сотрудники</span>
                                <span class="multi-select-arrow">▼</span>
                            </button>
                            <div class="multi-select-dropdown" id="dynEmployeesDropdown" style="display: none;">
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_all" value="all" checked>
                                    <label for="dyn_emp_all">Все сотрудники</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_markina" value="Маркина И. М.">
                                    <label for="dyn_emp_markina">Маркина И. М.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_ermoshina" value="Ермошина С. В.">
                                    <label for="dyn_emp_ermoshina">Ермошина С. В.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_kuznetsova" value="Кузнецова В. Ю.">
                                    <label for="dyn_emp_kuznetsova">Кузнецова В. Ю.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_anpilogov" value="Анпилогов Е. А.">
                                    <label for="dyn_emp_anpilogov">Анпилогов Е. А.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_tarasova" value="Тарасова К. И.">
                                    <label for="dyn_emp_tarasova">Тарасова К. И.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_borisova" value="Борисова В. А.">
                                    <label for="dyn_emp_borisova">Борисова В. А.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_moiseenko" value="Моисеенко А. А.">
                                    <label for="dyn_emp_moiseenko">Моисеенко А. А.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_ladygina" value="Ладыгина Д. В.">
                                    <label for="dyn_emp_ladygina">Ладыгина Д. В.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_zabrovskaya" value="Забровская А. В.">
                                    <label for="dyn_emp_zabrovskaya">Забровская А. В.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_sukhorukova" value="Сухорукова И. В.">
                                    <label for="dyn_emp_sukhorukova">Сухорукова И. В.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_korotenko" value="Коротенко П. Р.">
                                    <label for="dyn_emp_korotenko">Коротенко П. Р.</label>
                                </div>
                                <div class="multi-select-option">
                                    <input type="checkbox" id="dyn_emp_bakina" value="Бакина В. О.">
                                    <label for="dyn_emp_bakina">Бакина В. О.</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="filter-item">
                        <span class="filter-label">Дашборд:</span>
                        <select id="dynDashboard">
                            <option value="Автооценка" selected>Автооценка</option>
                            <option value="Автооценка УАВ/ПреХард">Автооценка УАВ/ПреХард</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <button id="dynUpdateButton" class="btn btn-primary">Обновить</button>
                    </div>
                </div>
            </div>

            </div>

            <!-- Прокручиваемый контент -->
            <div class="scrollable-content">
                <!-- Блок с динамикой по команде -->
                <div class="collapsible-section">
                    <div class="collapsible-header" id="dynamicsTeamDetailsHeader">
                        <h4 style="margin: 0; display: flex; align-items: center;">
                            <span class="collapse-arrow">▼</span>
                            <span style="margin-left: 10px;">Динамика по команде</span>
                        </h4>
                    </div>
                    <div class="collapsible-content" id="dynamicsTeamDetailsContent">
                        <div id="dynamicsTeamDetails" class="details-container">
                            <div class="loading">Загрузка динамики по команде...</div>
                        </div>
                    </div>
                </div>

                <!-- Блок с динамикой по подразделениям -->
                <div class="collapsible-section">
                    <div class="collapsible-header" id="dynamicsDepartmentsDetailsHeader">
                        <h4 style="margin: 0; display: flex; align-items: center;">
                            <span class="collapse-arrow">▼</span>
                            <span style="margin-left: 10px;">Динамика по подразделениям</span>
                        </h4>
                    </div>
                    <div class="collapsible-content" id="dynamicsDepartmentsDetailsContent">
                        <div id="dynamicsDepartmentsDetails" class="details-container">
                            <div class="loading">Загрузка динамики по подразделениям...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script src="debug-collapsible.js"></script>
    <script src="js/data/real-data-processor.js"></script>
    <script src="js/modules/ui-helpers.js"></script>
    <script src="js/modules/filters.js"></script>
    <script src="js/modules/tabs.js"></script>
    <script src="js/modules/details.js"></script>
    <script src="js/modules/dynamics.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            console.log('=== Тест динамики - DOM загружен ===');
            
            // Инициализируем сворачивающиеся блоки
            if (typeof initCollapsibleSections === 'function') {
                initCollapsibleSections();
            }
            
            // Инициализируем модуль динамики
            if (typeof initDynamicsModule === 'function') {
                initDynamicsModule();
                
                // Загружаем данные через 2 секунды
                setTimeout(() => {
                    console.log('Загружаем тестовые данные динамики...');
                    if (typeof loadDynamicsDetails === 'function') {
                        loadDynamicsDetails();
                    }
                }, 2000);
            } else {
                console.error('Функция initDynamicsModule не найдена');
            }
        });
    </script>
</body>
</html>
